server {
    # Docker's embedded DNS. Re-resolve `api` so a recreated API container (new IP) is picked up
    # without restarting this one; a literal proxy_pass host is resolved once at startup.
    # The variable in proxy_pass is what makes nginx use the resolver at request time.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3001;

    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Crash-report envelopes (screenshot feedback can be a few MB; the API enforces 5 MB).
    location = /api/sentry-tunnel {
        client_max_body_size 6m;
        proxy_pass $api_upstream/sentry-tunnel$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # With a variable, nginx no longer swaps the /api/ prefix for /, so strip it here.
        # `break` keeps the rewritten URI (query string is re-appended) for proxy_pass.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
