import groovy.json.JsonSlurper
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Release signing comes from the environment (CI writes the keystore from repo
// secrets; see docs/android.md). No keystore is ever committed.
def releaseKeystore = System.getenv("ANDROID_KEYSTORE_PATH")
def hasReleaseSigning = releaseKeystore && file(releaseKeystore).exists()

android {
    namespace = "com.octaviapp.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.octaviapp.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play rejects a versionCode it has seen before; CI passes the run number.
        versionCode((System.getenv("ANDROID_VERSION_CODE") ?: "1") as int)
        versionName System.getenv("ANDROID_VERSION_NAME") ?: "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// A release must never carry the local-API debug settings (mixed content, a
// live-reload server URL) from a stale `cap sync`, and must be signed.
tasks.register('checkReleaseConfig') {
    def configFile = file('src/main/assets/capacitor.config.json')
    inputs.file(configFile).optional()
    doLast {
        if (!configFile.exists()) throw new GradleException("Run `cap sync android` before building a release.")
        def config = new JsonSlurper().parse(configFile)
        if (config.android?.allowMixedContent) {
            throw new GradleException("capacitor.config.json has android.allowMixedContent=true (a KS_ANDROID_DEV_API sync). Re-run `cap sync android` without it.")
        }
        if (config.server?.url || config.server?.cleartext) {
            throw new GradleException("capacitor.config.json has server.url/cleartext set (a dev-server sync). Re-run `cap sync android` without it.")
        }
        def html = file('src/main/assets/public/index.html')
        if (!html.exists()) throw new GradleException("No web build in assets/public. Build apps/web and run `cap sync android`.")
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'checkReleaseConfig' }
gradle.taskGraph.whenReady { graph ->
    def buildingRelease = graph.allTasks.any { it.project == project && it.name in ['bundleRelease', 'assembleRelease'] }
    if (buildingRelease && !hasReleaseSigning && !project.hasProperty('allowUnsignedRelease')) {
        throw new GradleException("Release signing is not configured: set ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (or pass -PallowUnsignedRelease).")
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
