<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <!-- OctaviApp "Ring": twelve keys in a circle (an octave), one lit red, a glass hub.
       #background and #foreground are separate so the same file feeds the Android adaptive
       icon, the maskable PWA icon and the favicons. The mark stays inside the 66 unit safe zone
       when #foreground is scaled to 0.9. -->
  <defs>
    <linearGradient id="o-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26262A"/><stop offset="1" stop-color="#0B0B0D"/></linearGradient>
    <radialGradient id="o-glow" cx=".5" cy=".5" r=".5"><stop offset=".55" stop-color="#B4323E" stop-opacity="0"/><stop offset="1" stop-color="#B4323E" stop-opacity=".25"/></radialGradient>
    <linearGradient id="o-ivory" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#DAD7CF"/></linearGradient>
    <linearGradient id="o-red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E35A6A"/><stop offset="1" stop-color="#9A2A35"/></linearGradient>
    <linearGradient id="o-glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity=".06"/></linearGradient>
  </defs>
  <g id="background"><rect width="108" height="108" fill="url(#o-bg)"/><circle cx="54" cy="54" r="40" fill="url(#o-glow)"/></g>
  <g id="foreground">
    <g id="keys"><rect x="50.2" y="19" width="7.6" height="16" rx="2.4" fill="url(#o-ivory)" transform="rotate(0 54 54)"/><rect x="50.2" y="19" width="7.6" height="16" rx="2.4" fill="url(#o-red)" transform="rotate(30 54 54)"/><rect x="50.2" y="19" width="7.6" height="16" rx="2.4" fill="url(#o-ivory)" transform="rotate(60 54 54)"/><rect x="50.2" y="19" width="7.6" height="16" rx="2.4" fill="url(#o-ivory)" transform="rotate(90 54 54)"/><rect x="50.2" y="19" width="7.6" height="16" rx="2.4" fill="url(#o-ivory)" transform="rotate(120 54 54)"/><rect x="50.2" y="19" width="7.6" height="16" rx="2.4" fill="url(#o-ivory)" transform="rotate(150 54 54)"/><rect x="50.2" y="19" width="7.6" height="16" rx="2.4" fill="url(#o-ivory)" transform="rotate(180 54 54)"/><rect x="50.2" y="19" width="7.6" height="16" rx="2.4" fill="url(#o-ivory)" transform="rotate(210 54 54)"/><rect x="50.2" y="19" width="7.6" height="16" rx="2.4" fill="url(#o-ivory)" transform="rotate(240 54 54)"/><rect x="50.2" y="19" width="7.6" height="16" rx="2.4" fill="url(#o-ivory)" transform="rotate(270 54 54)"/><rect x="50.2" y="19" width="7.6" height="16" rx="2.4" fill="url(#o-ivory)" transform="rotate(300 54 54)"/><rect x="50.2" y="19" width="7.6" height="16" rx="2.4" fill="url(#o-ivory)" transform="rotate(330 54 54)"/></g>
    <circle cx="54" cy="54" r="13" fill="url(#o-glass)" stroke="#fff" stroke-opacity=".55" stroke-width=".8"/>
    <circle cx="54" cy="54" r="4.2" fill="#B4323E"/>
  </g>
</svg>
