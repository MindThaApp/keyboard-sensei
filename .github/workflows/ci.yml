name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # Real Postgres for apps/api/src/integration.db.test.ts (skipped when
    # TEST_DATABASE_URL is unset). Every other API suite mocks Prisma.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: keyboard_sensei
          POSTGRES_PASSWORD: keyboard_sensei
          POSTGRES_DB: keyboard_sensei_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keyboard_sensei"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://keyboard_sensei:keyboard_sensei@localhost:5432/keyboard_sensei_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate # @prisma/client types must be generated before typecheck
      - run: pnpm typecheck
      - run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: pnpm test
      - run: pnpm build

  docker-images:
    # Builds the deployable images on GitHub instead of the home server.
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: web
            dockerfile: apps/web/Dockerfile
          - app: api
            dockerfile: apps/api/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR image names must be lowercase; the repository owner may not be.
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          # Baked into the web bundle at build time; matches the home-server deploy.
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
