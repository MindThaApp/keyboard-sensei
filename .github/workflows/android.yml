name: Android release

# Builds a signed release AAB for Google Play. See docs/android.md for the
# keystore, the secrets below and the Play Console steps.
#
# Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#          ANDROID_KEY_PASSWORD
# API URL: repository variable VITE_API_URL (or a secret of the same name).

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName shown in Play (defaults to the tag, or 0.1.<run number>)"
        required: false

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_B64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing ANDROID_KEY_PASSWORD"
          [ -n "$VITE_API_URL" ] || missing="$missing VITE_API_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets/variables:$missing (see docs/android.md)"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3

      - run: pnpm install --frozen-lockfile

      # Refuses a missing or non-https VITE_API_URL.
      - name: Build web app
        run: pnpm --filter @keyboard-sensei/mobile build:web

      - name: Sync Capacitor
        working-directory: apps/mobile
        run: pnpm exec cap sync android

      - name: Native unit tests
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Write upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then name="$INPUT_VERSION"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then name="${GITHUB_REF_NAME#android-v}"
          else name="0.1.${GITHUB_RUN_NUMBER}"; fi
          # Play needs a strictly increasing versionCode; the run number is.
          echo "ANDROID_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "versionName=$name versionCode=${GITHUB_RUN_NUMBER}"

      - name: Build signed release bundle
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Verify signature
        run: |
          aab=apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$aab" | tee /dev/stderr | grep -q "jar verified"
          ls -l "$aab"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: keyboard-sensei-${{ env.ANDROID_VERSION_NAME }}-${{ env.ANDROID_VERSION_CODE }}-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
