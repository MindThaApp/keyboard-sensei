# Deploy variant that pulls CI-built images from GHCR instead of building on the
# server. Requires a one-time `docker login ghcr.io` on the server with a PAT that
# has read:packages (images are private). Usage:
#   docker compose --env-file .env.deploy -f docker-compose.ghcr.yml pull
#   docker compose --env-file .env.deploy -f docker-compose.ghcr.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: keyboard_sensei
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: keyboard_sensei
    volumes:
      - keyboard-sensei-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyboard_sensei"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: ghcr.io/ramin-azizi/keyboard-sensei-api:latest
    environment:
      DATABASE_URL: postgresql://keyboard_sensei:${POSTGRES_PASSWORD}@postgres:5432/keyboard_sensei
      JWT_SECRET: ${JWT_SECRET}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN}
      # Makes the seed refuse to run without ADMIN_PASSWORD (no published fallback).
      NODE_ENV: production
      # Caddy -> web (nginx) -> api: two proxy hops, so the login/sign-up rate limits
      # key on the real client IP instead of nginx's.
      TRUST_PROXY: 2
      # Set REGISTRATION_OPEN=false in .env.deploy to close self-service sign-up.
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      # Public release settings; see docker-compose.deploy.yml and docs/operations.md.
      # (VITE_GOOGLE_CLIENT_ID is a build arg, so the CI-built web image has no Google button.)
      PUBLIC_CATALOGUE: ${PUBLIC_CATALOGUE:-false}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      APP_URL: ${APP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
    volumes:
      - keyboard-sensei-tts-cache:/app/apps/api/data/tts-cache
      - keyboard-sensei-midi-library:/app/apps/api/data/midi-library
      - keyboard-sensei-instruments:/app/apps/api/data/instruments
      - keyboard-sensei-feedback-screenshots:/app/apps/api/data/feedback-screenshots
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    # VITE_API_URL is baked as /api at CI build time and proxied by nginx.
    image: ghcr.io/ramin-azizi/keyboard-sensei-web:latest
    depends_on:
      - api
    restart: unless-stopped

  # HTTPS on the LAN so Web MIDI (navigator.requestMIDIAccess) works — browsers only
  # allow it in a "secure context", which plain http://<lan-ip> never satisfies. Uses
  # Caddy's own internal CA (not mkcert, not a public CA) since this is LAN-only, not
  # exposed to the internet. Devices that want real MIDI hardware need to trust that
  # CA once (see the deploy notes for how to fetch it from the caddy_data volume).
  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - keyboard-sensei-caddy-data:/data
      - keyboard-sensei-caddy-config:/config
    ports:
      - "8181:8181"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  keyboard-sensei-postgres-data:
  keyboard-sensei-tts-cache:
  keyboard-sensei-midi-library:
  keyboard-sensei-instruments:
  keyboard-sensei-feedback-screenshots:
  keyboard-sensei-caddy-data:
  keyboard-sensei-caddy-config:
