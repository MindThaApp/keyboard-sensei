services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: keyboard_sensei
      POSTGRES_PASSWORD: keyboard_sensei
      POSTGRES_DB: keyboard_sensei
    ports:
      - "5432:5432"
    volumes:
      - keyboard-sensei-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyboard_sensei"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  keyboard-sensei-postgres:
