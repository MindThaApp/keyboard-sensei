services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: keyboard_sensei
      POSTGRES_PASSWORD: keyboard_sensei
      POSTGRES_DB: keyboard_sensei
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - keyboard-sensei-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyboard_sensei"]
      interval: 5s
      timeout: 5s
      retries: 10
  # Sheet-music recognition for local development (docs/operations.md, "Sheet-music recognition"):
  #   docker compose --profile omr up -d omr   and   OMR_SERVICE_URL=http://localhost:8090
  omr:
    build:
      context: services/omr
    ports:
      - "127.0.0.1:8090:8090"
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /home/omr:size=64m
    cpus: 2
    mem_limit: 2560m
    profiles: ["omr"]
volumes:
  keyboard-sensei-postgres:
