services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: keyboard_sensei
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: keyboard_sensei
    volumes:
      - keyboard-sensei-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyboard_sensei"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://keyboard_sensei:${POSTGRES_PASSWORD}@postgres:5432/keyboard_sensei
      JWT_SECRET: ${JWT_SECRET}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN}
      # Makes the seed refuse to run without ADMIN_PASSWORD (no published fallback).
      NODE_ENV: production
      # Caddy -> web (nginx) -> api: two proxy hops, so the login/sign-up rate limits
      # key on the real client IP instead of nginx's.
      TRUST_PROXY: 2
      # Set REGISTRATION_OPEN=false in .env.deploy to close self-service sign-up.
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      # Public release (docs/operations.md, "Public exposure"). All optional; empty = off/unset.
      PUBLIC_CATALOGUE: ${PUBLIC_CATALOGUE:-false}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      APP_URL: ${APP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      # Error monitoring (Sentry, EU). All optional; unset DSN = off. docs/operations.md.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TUNNEL_DSNS: ${SENTRY_TUNNEL_DSNS:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      GIT_SHA: ${GIT_SHA:-}
      # Sheet music from a photo or PDF (beta). Set to http://omr:8090 and start the
      # "omr" profile (below) to turn it on; empty = feature off. docs/operations.md, "Sheet-music recognition".
      OMR_SERVICE_URL: ${OMR_SERVICE_URL:-}
    networks:
      - default
      - omr
    volumes:
      - keyboard-sensei-tts-cache:/app/apps/api/data/tts-cache
      - keyboard-sensei-midi-library:/app/apps/api/data/midi-library
      - keyboard-sensei-instruments:/app/apps/api/data/instruments
      - keyboard-sensei-feedback-screenshots:/app/apps/api/data/feedback-screenshots
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        # The Google OAuth *Web* client ID; empty = no "Sign in with Google" button.
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        # Error monitoring (Sentry). All optional; builds are unaffected when unset.
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        GIT_SHA: ${GIT_SHA:-}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
    depends_on:
      - api
    restart: unless-stopped

  # Public exposure through a Cloudflare Tunnel (off by default). Start with:
  #   docker compose --env-file .env.deploy -f docker-compose.deploy.yml --profile public up -d
  # The tunnel dials out to Cloudflare, so no router port is opened. In the Cloudflare
  # dashboard, route the public hostname to http://web:80 (the same nginx Caddy uses).
  # Caddy and the LAN route on :8181 keep working alongside it.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.3
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
    restart: unless-stopped
    profiles: ["public"]

  # Sheet-music recognition (beta, off by default): homr (AGPL-3.0) as a separate program
  # in its own container, reachable only by the API over the internal "omr" network, which
  # has no route out. One recognition at a time; the API queues the rest. Start with:
  #   docker compose --env-file .env.deploy -f docker-compose.deploy.yml --profile omr up -d
  # and set OMR_SERVICE_URL=http://omr:8090 in .env.deploy. docs/operations.md, "Sheet-music recognition".
  omr:
    build:
      context: services/omr
    networks:
      - omr
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /home/omr:size=64m
    cpus: 2
    mem_limit: 2560m
    memswap_limit: 2560m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    profiles: ["omr"]

  # HTTPS on the LAN so Web MIDI (navigator.requestMIDIAccess) works — browsers only
  # allow it in a "secure context", which plain http://<lan-ip> never satisfies. Uses
  # Caddy's own internal CA (not mkcert, not a public CA) since this is LAN-only, not
  # exposed to the internet. Devices that want real MIDI hardware need to trust that
  # CA once (see the deploy notes for how to fetch it from the caddy_data volume).
  caddy:
    image: caddy:2-alpine
    environment:
      # The LAN address or hostname clients use (Caddy issues its internal cert for it).
      DEPLOY_HOST: ${DEPLOY_HOST:-127.0.0.1}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - keyboard-sensei-caddy-data:/data
      - keyboard-sensei-caddy-config:/config
    ports:
      - "8181:8181"
    depends_on:
      - web
    restart: unless-stopped

networks:
  default:
  # API <-> OMR only: no gateway, so the recognition service can't reach anything else.
  omr:
    internal: true

volumes:
  keyboard-sensei-postgres-data:
  keyboard-sensei-tts-cache:
  keyboard-sensei-midi-library:
  keyboard-sensei-instruments:
  keyboard-sensei-feedback-screenshots:
  keyboard-sensei-caddy-data:
  keyboard-sensei-caddy-config:
