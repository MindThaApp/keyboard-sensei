openapi: 3.0.3
info:
  title: Keyboard Sensei API
  version: 0.2.0
  description: Authoritative frontend/backend contract.
servers:
  - url: http://localhost:3001
paths:
  /auth/register:
    post:
      summary: Register a user and return an access token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example: { email: pianist@example.com, password: strong-password, display_name: Pianist }
      responses:
        '201': { description: Registered, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/login:
    post:
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { email: demo@keyboardsensei.local, password: demo-password }
      responses:
        '200': { description: Authenticated, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/me:
    get:
      summary: Get the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/AuthUser' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update the authenticated user's profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
            example: { display_name: Concert Pianist }
      responses:
        '200': { description: Updated user, content: { application/json: { schema: { $ref: '#/components/schemas/AuthUser' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/me/password:
    post:
      summary: Change the authenticated user's password
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
            example: { currentPassword: strong-password, newPassword: stronger-password }
      responses:
        '200': { description: Password changed, content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { type: boolean, enum: [true] } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /lessons:
    get:
      summary: List all lessons with user progress
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Ordered lessons
          content: { application/json: { schema: { type: array, items: { allOf: [{ $ref: '#/components/schemas/Lesson' }, { type: object, required: [order, progress], properties: { order: { type: integer }, progress: { $ref: '#/components/schemas/LessonProgress' } } }] } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /lessons/{id}:
    get:
      summary: Get full lesson JSON and progress
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string }, example: lesson-01 }]
      responses:
        '200': { description: Lesson detail, content: { application/json: { schema: { type: object, required: [lesson, progress, exercises], properties: { lesson: { $ref: '#/components/schemas/Lesson' }, progress: { nullable: true, allOf: [{ $ref: '#/components/schemas/LessonProgress' }] }, exercises: { type: array, items: { $ref: '#/components/schemas/MidiExercise' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /lessons/{lessonId}/sections/{sectionIndex}/narrate:
    post:
      summary: Generate or reuse narration for an authoritative lesson text section
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: lessonId, in: path, required: true, schema: { type: string }, example: lesson-01 }
        - { name: sectionIndex, in: path, required: true, schema: { type: integer, minimum: 0 }, example: 0 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [voiceId], properties: { voiceId: { type: string } } }
            example: { voiceId: 21m00Tcm4TlvDq8ikWAM }
      responses:
        '200': { description: Narration generated or reused, content: { application/json: { schema: { $ref: '#/components/schemas/TtsNarrationResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { description: Monthly shared narration allowance exhausted, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /tts/usage:
    get:
      summary: Get shared narration usage for the current calendar month
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current TTS usage, content: { application/json: { schema: { $ref: '#/components/schemas/TtsUsageWithPeriod' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /tts/audio/{id}:
    get:
      summary: Serve a cached narration MP3
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Cached MP3 audio, content: { audio/mpeg: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /exercises/{id}/attempts:
    post:
      summary: Score and save a lesson exercise attempt
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string }, example: exercise-01 }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PerformanceInput' }
            example: { rawEvents: [{ note: 48, velocity: 90, type: noteon, timestampMs: 0 }, { note: 48, velocity: 0, type: noteoff, timestampMs: 750 }] }
      responses:
        '201': { description: Scored attempt, content: { application/json: { schema: { $ref: '#/components/schemas/ScoringResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /quiz-questions/{id}/answer:
    post:
      summary: Answer and save a quiz question
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string }, example: q2-1 }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [selectedAnswer], properties: { selectedAnswer: { type: integer, minimum: 0 } } }, example: { selectedAnswer: 0 } } }
      responses:
        '200': { description: 'Wrong answers return only correct; correct answers also return the answer key and explanation', content: { application/json: { schema: { type: object, required: [correct], properties: { correct: { type: boolean }, correctIndex: { type: integer, minimum: 0 }, explanation: { type: string } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/me/progress:
    get:
      summary: Get lesson statuses and best scores
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User progress
          content: { application/json: { schema: { type: object, required: [completedLessonIds, bestScores, lessonStatuses], properties: { completedLessonIds: { type: array, items: { type: string } }, bestScores: { type: object, additionalProperties: { type: number } }, lessonStatuses: { type: array, items: { $ref: '#/components/schemas/LessonProgress' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/me/attempts:
    get:
      summary: List the user's saved exercise attempts, newest first (max 100)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Recent exercise attempts
          content: { application/json: { schema: { type: object, required: [attempts], properties: { attempts: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ExerciseAttemptSummary' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /practice/score:
    post:
      summary: Score an ad-hoc MIDI Practice Gym exercise without saving it
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [exercise]
                  properties: { exercise: { $ref: '#/components/schemas/MidiExercise' } }
                - $ref: '#/components/schemas/PerformanceInput'
      responses:
        '200': { description: Practice score, content: { application/json: { schema: { $ref: '#/components/schemas/ScoringResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /feedback:
    post:
      summary: Submit feedback or an issue report (rate-limited 10/hour/user)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FeedbackRequest' } } }
      responses:
        '201': { description: Accepted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { description: Rate limited }
  /songs:
    get:
      summary: List the song library (seeded songs + caller's uploads; admins see all uploads)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Songs, content: { application/json: { schema: { type: object, properties: { songs: { type: array, items: { $ref: '#/components/schemas/Song' } } } } } } }
  /songs/upload:
    post:
      summary: Upload a .mid file (raw bytes body, metadata in query params title/artist/genre, max 1 MB)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Song' } } } }
        '422': { description: Invalid MIDI (unparseable, too short/long, no piano notes) }
  /songs/{id}/file:
    get:
      summary: Stream the raw MIDI bytes for a song
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: audio/midi bytes }
        '404': { $ref: '#/components/responses/NotFound' }
  /songs/{id}:
    delete:
      summary: Delete a song (uploader deletes own; admin deletes any)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Deleted }
        '403': { description: Not the uploader and not admin }
  /songs/{id}/attempts:
    post:
      summary: Record a play-along attempt
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PlayAlongAttemptRequest' } } }
      responses:
        '201': { description: Recorded }
  /songs/attempts/me:
    get:
      summary: Caller's play-along personal bests and recent attempts
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Bests keyed by song id + recent list }
  /admin/users:
    get:
      summary: "[admin] List users with progress summary"
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Users }
        '403': { description: Not an admin }
  /admin/users/{id}:
    patch:
      summary: "[admin] Update email/display_name/role/password"
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Updated } }
    delete:
      summary: "[admin] Delete a user (cannot delete self)"
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Deleted }, '400': { description: cannot_delete_self } }
  /admin/users/{id}/progress:
    get:
      summary: "[admin] Per-lesson progress for a user (all lessons)"
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Progress rows } }
  /admin/users/{id}/progress/{lessonId}:
    put:
      summary: "[admin] Set a lesson's status/best score for a user"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: lessonId, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: Upserted } }
  /admin/feedback:
    get:
      summary: "[admin] List feedback (filter ?status=open|resolved|all)"
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Feedback list } }
  /admin/feedback/{id}:
    patch:
      summary: "[admin] Set feedback status open/resolved"
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Updated } }
  /admin/songs/{id}:
    patch:
      summary: "[admin] Edit song metadata (title/artist/genre/difficulty)"
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Updated } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    BadRequest: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Unauthorized: { description: Authentication failed, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: Unique value conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties: { error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string }, details: {} } } }
    RegisterRequest: { allOf: [{ $ref: '#/components/schemas/LoginRequest' }, { type: object, required: [display_name], properties: { display_name: { type: string } } }] }
    LoginRequest: { type: object, required: [email, password], properties: { email: { type: string, format: email }, password: { type: string, minLength: 8 } } }
    UpdateProfileRequest:
      type: object
      minProperties: 1
      properties:
        display_name: { type: string, minLength: 1, maxLength: 80 }
        narration_voice_id: { type: string, nullable: true }
    ChangePasswordRequest: { type: object, required: [currentPassword, newPassword], properties: { currentPassword: { type: string, minLength: 1 }, newPassword: { type: string, minLength: 8 } } }
    AuthUser: { type: object, required: [id, email, display_name, narration_voice_id, role], properties: { id: { type: string }, email: { type: string, format: email }, display_name: { type: string }, narration_voice_id: { type: string, nullable: true }, role: { type: string, enum: [user, admin] } } }
    Song: { type: object, required: [id, title, artist, genre, difficulty, duration_sec, note_count, content_rights, mine], properties: { id: { type: string }, title: { type: string }, artist: { type: string }, genre: { type: string, enum: [classical, pop, film, game, jazz, other] }, difficulty: { type: integer, minimum: 1, maximum: 5 }, duration_sec: { type: number }, note_count: { type: integer }, content_rights: { type: string }, mine: { type: boolean } } }
    PlayAlongAttemptRequest: { type: object, required: [score, accuracy, tempo_pct, lookahead_s, wait_mode], properties: { score: { type: number, minimum: 0, maximum: 150 }, accuracy: { type: number, minimum: 0, maximum: 100 }, tempo_pct: { type: integer, enum: [25, 50, 75, 100] }, lookahead_s: { type: number }, wait_mode: { type: boolean } } }
    FeedbackRequest: { type: object, required: [type, message, page_path], properties: { type: { type: string, enum: [bug, idea, other] }, message: { type: string, maxLength: 2000 }, page_path: { type: string, maxLength: 300 } } }
    TtsUsage:
      type: object
      required: [charactersUsed, limit, remaining, disabled]
      properties:
        charactersUsed: { type: integer, minimum: 0 }
        limit: { type: integer, enum: [10000] }
        remaining: { type: integer, minimum: 0 }
        disabled: { type: boolean }
    TtsUsageWithPeriod:
      allOf:
        - $ref: '#/components/schemas/TtsUsage'
        - type: object
          required: [period]
          properties: { period: { type: string, pattern: '^\d{4}-\d{2}$', example: 2026-07 } }
    TtsNarrationResponse:
      type: object
      required: [audioUrl, cached, usage]
      properties:
        audioUrl: { type: string, example: /tts/audio/cm123 }
        cached: { type: boolean }
        usage: { $ref: '#/components/schemas/TtsUsage' }
    AuthResponse:
      type: object
      required: [accessToken, user]
      properties: { accessToken: { type: string }, user: { $ref: '#/components/schemas/AuthUser' } }
    Lesson:
      type: object
      required: [id, path, level, branch, title, estimatedMinutes, objectives, sections, unlockCriteria, skillRewards]
      properties:
        id: { type: string }
        path: { type: string, enum: [classical-technical, modern-chords, sightreading-intensive] }
        level: { type: string, enum: [foundation, elementary, intermediate, late-intermediate, advanced, virtuoso] }
        branch: { type: string, enum: [technique, theory, repertoire] }
        title: { type: string }
        estimatedMinutes: { type: integer }
        objectives: { type: array, items: { type: string } }
        sections: { type: array, description: 'Quiz questions in lesson payloads never include correctIndex; answers are validated server-side via POST /quiz-questions/{id}/answer, whose response returns the correct index.', items: { type: object, required: [type], properties: { type: { type: string, enum: [markdown, theory-card, notation, midi-exercise, quiz] }, contentRights: { $ref: '#/components/schemas/ContentRightsMetadata' } }, additionalProperties: true } }
        unlockCriteria: { type: object, properties: { requiresLessonIds: { type: array, items: { type: string } }, minScore: { type: number } } }
        skillRewards: { type: object, additionalProperties: { type: number } }
    LessonProgress:
      type: object
      required: [lessonId, status, bestScore, completedAt]
      properties:
        lessonId: { type: string }
        status: { type: string, enum: [locked, unlocked, completed] }
        bestScore: { type: number }
        completedAt: { type: string, format: date-time, nullable: true }
    RawMidiEvent: { type: object, required: [note, velocity, type, timestampMs], properties: { note: { type: integer, minimum: 0, maximum: 127 }, velocity: { type: integer, minimum: 0, maximum: 127 }, type: { type: string, enum: [noteon, noteoff] }, timestampMs: { type: number } } }
    ContentRightsMetadata:
      type: object
      required: [workTitle, composer, status, copyrightHolder, licenseReference]
      description: Licensed copyrighted works require non-null copyrightHolder and licenseReference values.
      properties:
        workTitle: { type: string }
        composer: { type: string }
        status: { type: string, enum: [original, public-domain, licensed-copyright] }
        copyrightHolder: { type: string, nullable: true }
        licenseReference: { type: string, nullable: true }
    PerformedNote: { type: object, required: [note, velocity, startTimestampMs, endTimestampMs, durationMs], properties: { note: { type: integer }, velocity: { type: integer }, startTimestampMs: { type: number }, endTimestampMs: { type: number, nullable: true }, durationMs: { type: number, nullable: true } } }
    PerformanceInput:
      oneOf:
        - type: object
          required: [rawEvents]
          properties: { rawEvents: { type: array, items: { $ref: '#/components/schemas/RawMidiEvent' } } }
        - type: object
          required: [performedNotes]
          properties: { performedNotes: { type: array, items: { $ref: '#/components/schemas/PerformedNote' } } }
    ExpectedNoteEvent: { type: object, required: [id, note, startBeat, durationBeats, hand, finger, chordGroupId, voice], properties: { id: { type: string }, note: { type: integer }, startBeat: { type: number }, durationBeats: { type: number }, hand: { type: string, enum: [left, right, both] }, finger: { type: integer, nullable: true }, chordGroupId: { type: string, nullable: true }, voice: { type: string, nullable: true, enum: [melody, bass, inner, chord] } } }
    MidiExercise: { type: object, required: [exerciseId, tempoBpm, difficulty, simultaneityWindowMs, timingToleranceMs, durationTolerancePercent, expected], properties: { exerciseId: { type: string }, tempoBpm: { type: number }, difficulty: { type: string, enum: [beginner, intermediate, advanced] }, scoring: { type: string, enum: [timed, untimed], description: 'Optional; untimed exercises skip timing scoring. Defaults to timed when omitted.' }, simultaneityWindowMs: { type: number }, timingToleranceMs: { type: number }, durationTolerancePercent: { type: number }, expected: { type: array, items: { $ref: '#/components/schemas/ExpectedNoteEvent' } } } }
    ScoringMistake: { type: object, properties: { noteId: { type: string, nullable: true }, expectedNote: { type: integer, nullable: true }, performedNote: { type: integer, nullable: true }, chordGroupId: { type: string, nullable: true }, issue: { type: string, enum: [wrong, missed, extra, early, late, missing-chord-tone, extra-chord-tone, uneven-hand-timing, held-too-short, held-too-long, duration-unknown] } } }
    ScoringResult: { type: object, required: [score, noteAccuracy, timingAccuracy, rhythmAccuracy, chordAccuracy, feedback, mistakes], properties: { score: { type: number }, noteAccuracy: { type: number }, timingAccuracy: { type: number }, rhythmAccuracy: { type: number }, chordAccuracy: { type: number }, feedback: { type: array, items: { type: string } }, mistakes: { type: array, items: { $ref: '#/components/schemas/ScoringMistake' } } } }
    ExerciseAttemptSummary:
      type: object
      required: [id, exerciseId, lessonId, lessonTitle, score, createdAt]
      properties:
        id: { type: string }
        exerciseId: { type: string }
        lessonId: { type: string }
        lessonTitle: { type: string }
        score: { type: number }
        createdAt: { type: string, format: date-time }
